<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>dontpad</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; flex-direction: column; }
        #status { padding: 0.5rem 1rem; background: #f5f5f5; border-bottom: 1px solid #ddd; font-size: 0.85rem; color: #666; }
        #status.error { background: #fdecea; color: #b71c1c; }
        #editor { flex: 1; width: 100%; padding: 1rem; border: none; outline: none; resize: none; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div id="status">Loading…</div>
    <textarea id="editor" placeholder="Start typing…" spellcheck="false"></textarea>
    <script src="/app.js"></script>
</body>
</html>
